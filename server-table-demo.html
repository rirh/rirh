<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServerTable 组件演示</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 240 10% 3.9%;
            --card: 0 0% 100%;
            --card-foreground: 240 10% 3.9%;
            --popover: 0 0% 100%;
            --popover-foreground: 240 10% 3.9%;
            --primary: 240 9% 13%;
            --primary-foreground: 0 0% 98%;
            --secondary: 240 4.8% 95.9%;
            --secondary-foreground: 240 5.9% 10%;
            --muted: 240 4.8% 95.9%;
            --muted-foreground: 240 3.8% 46.1%;
            --accent: 240 4.8% 95.9%;
            --accent-foreground: 240 5.9% 10%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 0 0% 98%;
            --border: 240 5.9% 90%;
            --input: 240 5.9% 90%;
            --ring: 240 10% 3.9%;
            --radius: 0.5rem;
        }
        body {
            background: hsl(var(--background));
            color: hsl(var(--foreground));
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // Lucide icons as simple SVG components
        const ChevronUp = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m18 15-6-6-6 6"/>
            </svg>
        );

        const ChevronDown = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m6 9 6 6 6-6"/>
            </svg>
        );

        const ChevronsUpDown = ({ className }) => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="m7 15 5 5 5-5"/>
                <path d="m7 9 5-5 5 5"/>
            </svg>
        );

        const Search = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
            </svg>
        );

        // Utility function
        const cn = (...classes) => classes.filter(Boolean).join(' ');

        // Sample data
        const sampleServerData = [
            {
                id: "1",
                instance: "web-server-01",
                health: 98,
                cpuUsage: 45,
                memoryUsage: 67,
                status: "healthy",
                location: "US-East",
                uptime: "15d 4h"
            },
            {
                id: "2", 
                instance: "api-server-02",
                health: 85,
                cpuUsage: 78,
                memoryUsage: 89,
                status: "warning",
                location: "EU-West",
                uptime: "8d 12h"
            },
            {
                id: "3",
                instance: "db-server-03", 
                health: 45,
                cpuUsage: 95,
                memoryUsage: 96,
                status: "critical",
                location: "Asia-Pacific",
                uptime: "2d 6h"
            },
            {
                id: "4",
                instance: "cache-server-04",
                health: 92,
                cpuUsage: 23,
                memoryUsage: 45,
                status: "healthy",
                location: "US-West",
                uptime: "25d 8h"
            },
            {
                id: "5",
                instance: "lb-server-05",
                health: 88,
                cpuUsage: 34,
                memoryUsage: 56,
                status: "healthy",
                location: "EU-Central",
                uptime: "12d 3h"
            }
        ];

        // Column configuration
        const columns = [
            {
                field: "instance",
                label: "实例名称",
                sortable: false,
                render: (value, row) => (
                    <div className="font-medium">
                        <div className="text-sm">{value}</div>
                        <div className="text-xs text-gray-500">{row.location}</div>
                    </div>
                )
            },
            {
                field: "health",
                label: "健康值",
                sortable: true,
                render: (value) => (
                    <div className="text-center">
                        <div className={cn(
                            "inline-flex items-center px-2 py-1 rounded-full text-xs font-medium",
                            value >= 90 ? "bg-green-100 text-green-800" :
                            value >= 70 ? "bg-yellow-100 text-yellow-800" :
                            "bg-red-100 text-red-800"
                        )}>
                            {value}%
                        </div>
                    </div>
                )
            },
            {
                field: "cpuUsage",
                label: "CPU使用率",
                sortable: true,
                render: (value) => (
                    <div className="space-y-1">
                        <div className="text-sm font-medium">{value}%</div>
                        <div className="w-full bg-gray-200 rounded-full h-2">
                            <div 
                                className={cn(
                                    "h-2 rounded-full transition-all",
                                    value >= 80 ? "bg-red-500" :
                                    value >= 60 ? "bg-yellow-500" :
                                    "bg-green-500"
                                )}
                                style={{ width: `${value}%` }}
                            />
                        </div>
                    </div>
                )
            },
            {
                field: "memoryUsage",
                label: "内存使用率",
                sortable: true,
                render: (value) => (
                    <div className="space-y-1">
                        <div className="text-sm font-medium">{value}%</div>
                        <div className="w-full bg-gray-200 rounded-full h-2">
                            <div 
                                className={cn(
                                    "h-2 rounded-full transition-all",
                                    value >= 80 ? "bg-red-500" :
                                    value >= 60 ? "bg-yellow-500" :
                                    "bg-green-500"
                                )}
                                style={{ width: `${value}%` }}
                            />
                        </div>
                    </div>
                )
            },
            {
                field: "status",
                label: "状态",
                sortable: false,
                render: (value) => (
                    <div className={cn(
                        "inline-flex items-center px-2 py-1 rounded-full text-xs font-medium",
                        value === "healthy" ? "bg-green-100 text-green-800" :
                        value === "warning" ? "bg-yellow-100 text-yellow-800" :
                        "bg-red-100 text-red-800"
                    )}>
                        {value === "healthy" ? "健康" : value === "warning" ? "警告" : "严重"}
                    </div>
                )
            },
            {
                field: "uptime",
                label: "运行时间", 
                sortable: false,
            }
        ];

        function ServerTable({ data = sampleServerData }) {
            const [searchTerm, setSearchTerm] = useState("");
            const [sortField, setSortField] = useState(null);
            const [sortDirection, setSortDirection] = useState(null);

            // Filter and sort data
            const processedData = useMemo(() => {
                let filtered = data.filter(row =>
                    row.instance.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    row.location.toLowerCase().includes(searchTerm.toLowerCase())
                );

                if (sortField && sortDirection) {
                    filtered.sort((a, b) => {
                        const aVal = a[sortField];
                        const bVal = b[sortField];
                        
                        if (typeof aVal === "number" && typeof bVal === "number") {
                            return sortDirection === "asc" ? aVal - bVal : bVal - aVal;
                        }
                        
                        const aStr = String(aVal).toLowerCase();
                        const bStr = String(bVal).toLowerCase();
                        if (sortDirection === "asc") {
                            return aStr < bStr ? -1 : aStr > bStr ? 1 : 0;
                        } else {
                            return aStr > bStr ? -1 : aStr < bStr ? 1 : 0;
                        }
                    });
                }

                return filtered;
            }, [data, searchTerm, sortField, sortDirection]);

            // Handle sorting
            const handleSort = (field, sortable) => {
                if (!sortable) return;

                if (sortField === field) {
                    if (sortDirection === "asc") {
                        setSortDirection("desc");
                    } else if (sortDirection === "desc") {
                        setSortDirection(null);
                        setSortField(null);
                    } else {
                        setSortDirection("asc");
                    }
                } else {
                    setSortField(field);
                    setSortDirection("asc");
                }
            };

            // Get sort icon
            const getSortIcon = (field, sortable) => {
                if (!sortable) return null;

                if (sortField === field) {
                    if (sortDirection === "asc") {
                        return <ChevronUp />;
                    } else if (sortDirection === "desc") {
                        return <ChevronDown />;
                    }
                }
                return <ChevronsUpDown className="opacity-50" />;
            };

            return (
                <div className="space-y-4 p-6">
                    <div className="space-y-2">
                        <h1 className="text-3xl font-bold tracking-tight">服务器状态监控</h1>
                        <p className="text-gray-600">
                            实时监控服务器状态，包括健康值、CPU使用率、内存使用率等关键指标
                        </p>
                    </div>

                    {/* Search input */}
                    <div className="relative max-w-sm">
                        <div className="absolute left-3 top-1/2 transform -translate-y-1/2">
                            <Search />
                        </div>
                        <input
                            type="text"
                            placeholder="搜索实例或位置..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            className="w-full h-10 pl-10 pr-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        />
                    </div>

                    {/* Table with fixed first column */}
                    <div className="border rounded-lg overflow-hidden">
                        <div className="overflow-x-auto">
                            <div className="min-w-[800px]">
                                <table className="w-full text-sm">
                                    <thead>
                                        <tr className="border-b">
                                            {columns.map((column, index) => (
                                                <th
                                                    key={column.field}
                                                    className={cn(
                                                        "h-12 px-4 text-left align-middle font-medium text-gray-500",
                                                        index === 0 && "sticky left-0 bg-white z-10 border-r min-w-[200px]",
                                                        column.sortable && "cursor-pointer select-none hover:bg-gray-50",
                                                        "transition-colors"
                                                    )}
                                                    onClick={() => handleSort(column.field, column.sortable)}
                                                >
                                                    <div className="flex items-center space-x-2">
                                                        <span>{column.label}</span>
                                                        {getSortIcon(column.field, column.sortable)}
                                                    </div>
                                                </th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {processedData.map((row) => (
                                            <tr key={row.id} className="border-b transition-colors hover:bg-gray-50">
                                                {columns.map((column, index) => (
                                                    <td
                                                        key={column.field}
                                                        className={cn(
                                                            "p-4 align-middle",
                                                            index === 0 && "sticky left-0 bg-white z-10 border-r min-w-[200px]"
                                                        )}
                                                    >
                                                        {column.render 
                                                            ? column.render(row[column.field], row)
                                                            : row[column.field]
                                                        }
                                                    </td>
                                                ))}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* Results summary */}
                    <div className="text-sm text-gray-500">
                        显示 {processedData.length} 个结果，共 {data.length} 个服务器实例
                    </div>
                </div>
            );
        }

        // Render the component
        ReactDOM.render(<ServerTable />, document.getElementById('root'));
    </script>
</body>
</html>
